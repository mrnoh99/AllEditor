name: Xcode open-and-build check
# Proves the repository opens and compiles in Xcode exactly as cloned: a fresh checkout (pushed commit, or main), no npm / node /
# Rust / CocoaPods on PATH, the app built from the root AllEditor.xcworkspace (what a user opens on the Mac).
# Also runs after the ieumoffice-ios build, because that workflow's bot commit (prebuilt Rust library) does not
# trigger push workflows by itself.
on:
  workflow_dispatch:
  push:
  workflow_run:
    workflows: ['ieumoffice-ios (Tauri) build']
    types: [completed]
concurrency:
  group: xcode-open-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_run' && 'main' || github.sha }}" }
      - name: Build the app from AllEditor.xcworkspace with nothing installed
        run: |
          set -o pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          xcodebuild -list -workspace AllEditor.xcworkspace
          b() { xcodebuild -workspace AllEditor.xcworkspace -scheme "$1" -configuration "$2" -sdk "$3" \
                  -destination "$4" CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/dd-$1-$3" build \
                | grep -E '^(error|warning: .*error)|BUILD (SUCCEEDED|FAILED)|: error:' ; }
          b AllEditor_iOS debug iphonesimulator 'generic/platform=iOS Simulator'
          b AllEditor_iOS release iphoneos 'generic/platform=iOS'
      - name: Working tree is still clean (the build wrote nothing tracked)
        run: |
          out=$(git status --porcelain --untracked-files=all)
          if [ -n "$out" ]; then echo "::error::the build changed tracked/untracked files:"; echo "$out"; git diff --stat; exit 1; fi
          echo 'clean'
