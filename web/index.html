<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AllEditor</title>
<style>
:root{--bg:#f2f2f7;--fg:#1c1c1e;--card:#fff;--mut:#8e8e93;--sep:#e5e5ea;--acc:#0a84ff;--bar:#e9e9ee}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff;--card:#1c1c1e;--sep:#38383a;--bar:#1a1a1c}}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--card:#1c1c1e;--sep:#38383a;--bar:#1a1a1c}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;background:var(--bar);overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex:none;border-bottom:1px solid var(--sep)}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;flex:none;max-width:200px;background:transparent;border-radius:10px 10px 0 0;border-top:3px solid transparent}
.tab.on{background:var(--bg);border-top-color:var(--acc)}
.tab.docs.on{border-top-color:#2b6cd4}.tab.slides.on{border-top-color:#d24726}.tab.sheets.on{border-top-color:#1e7145}.tab.pdf.on{border-top-color:#e03a3e}
.tl{padding:9px 6px 9px 12px;font-size:15px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tx{padding:9px 10px 9px 4px;font-size:12px;color:var(--mut)}
.tab:not(.on) .tl{color:var(--mut)}
.gear{margin-left:auto;flex:none;padding:6px 12px;font-size:22px;color:var(--mut)}.gear.on{color:var(--acc)}
#panes{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.pane[hidden],#homePane[hidden],#settingsPane[hidden]{display:none}
#homePane,#settingsPane{position:absolute;inset:0;overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 16px)}
main{max-width:720px;margin:0 auto}
h1{font-size:34px;margin:20px 0 8px}h2{font-size:13px;text-transform:uppercase;color:var(--mut);margin:24px 4px 8px;letter-spacing:.04em}
.primary{width:100%;padding:16px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{padding:16px 8px;border-radius:14px;background:var(--card);font-weight:600}
.card.docs{color:#2b6cd4}.card.slides{color:#d24726}.card.sheets{color:#1e7145}
.files,.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;border-top:1px solid var(--sep)}.row:first-child{border-top:0}
.file{flex:1;display:flex;align-items:center;gap:10px;padding:14px;text-align:left;min-width:0}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sz{color:var(--mut);font-size:13px}
.del{padding:0 16px;color:var(--mut)}
.tag{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:3px 6px;min-width:64px;text-align:center}
.tag.docs{background:#2b6cd4}.tag.slides{background:#d24726}.tag.sheets{background:#1e7145}.tag.pdf{background:#e03a3e}
.empty{margin:0;padding:18px;color:var(--mut)}
.fld{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--sep)}.group>.fld:first-child,.group>div>.fld:first-child{border-top:0}
.fl{flex:0 0 38%;color:var(--fg)}
.fld select,.fld input{flex:1;min-width:0;font:inherit;color:var(--fg);background:transparent;border:0;text-align:right;outline:0;padding:6px 0}
.hint{color:var(--mut);font-size:13px;margin:8px 6px}
.group .primary{width:calc(100% - 28px);margin:12px 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);background:rgba(60,60,67,.92);color:#fff;padding:10px 18px;border-radius:20px;z-index:9;font-size:15px}
</style></head>
<body>
<div id="tabs"></div>
<div id="panes"><div id="homePane"></div><div id="settingsPane" hidden></div></div>
<input id="picker" type="file" hidden accept=".docx,.dotx,.doc,.odt,.hwp,.hwpx,.pptx,.potx,.ppt,.odp,.xlsx,.xlsm,.xls,.ods,.csv,.tsv,.pdf">
<script src="./home.js"></script>
</body></html>
