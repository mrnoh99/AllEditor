<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AllEditor</title>
<style>
:root{--bg:#f2f2f7;--fg:#1c1c1e;--card:#fff;--mut:#8e8e93;--sep:#e5e5ea;--acc:#0a84ff;--bar:#e9e9ee}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff;--card:#1c1c1e;--sep:#38383a;--bar:#1a1a1c}}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--card:#1c1c1e;--sep:#38383a;--bar:#1a1a1c}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;background:var(--bar);overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex:none;border-bottom:1px solid var(--sep)}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;flex:none;max-width:200px;background:transparent;border-radius:10px 10px 0 0;border-top:3px solid transparent}
.tab.on{background:var(--bg);border-top-color:var(--acc)}
.tab.hwp.on{border-top-color:#1d9bd1}.tab.docs.on{border-top-color:#2b6cd4}.tab.slides.on{border-top-color:#d24726}.tab.sheets.on{border-top-color:#1e7145}.tab.pdf.on{border-top-color:#e03a3e}
.tl{padding:9px 6px 9px 12px;font-size:15px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tl.back{flex:none;color:var(--acc);font-weight:600;padding-right:10px}
.tx{padding:9px 10px 9px 4px;font-size:12px;color:var(--mut)}
.tab:not(.on) .tl{color:var(--mut)}
.send{margin-left:auto;flex:none;padding:6px 12px;font-size:14px;font-weight:600;color:var(--acc);white-space:nowrap}
.send+.gear{margin-left:0}
.viewbtn{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--acc)}
.viewbtn+.send{margin-left:0}
body.ae-viewing #tabs{display:none}
.gear{margin-left:auto;flex:none;padding:6px 12px;font-size:22px;color:var(--mut)}.gear.on{color:var(--acc)}
#panes{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.pane[hidden],#homePane[hidden],#settingsPane[hidden]{display:none}
#homePane,#settingsPane{position:absolute;inset:0;overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 16px)}
main{max-width:720px;margin:0 auto}
h1{font-size:34px;margin:20px 0 8px}h2{font-size:13px;text-transform:uppercase;color:var(--mut);margin:24px 4px 8px;letter-spacing:.04em}
.primary{width:100%;padding:16px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{padding:16px 8px;border-radius:14px;background:var(--card);font-weight:600}
.card.docs{color:#2b6cd4}.card.slides{color:#d24726}.card.sheets{color:#1e7145}
.files,.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;border-top:1px solid var(--sep)}.row:first-child{border-top:0}
.file{flex:1;display:flex;align-items:center;gap:10px;padding:14px;text-align:left;min-width:0}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sz{color:var(--mut);font-size:13px}
.del{padding:0 16px;color:var(--mut)}
.ren{padding:0 6px 0 12px;color:var(--mut);display:flex;align-items:center}
.tag{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:3px 6px;min-width:64px;text-align:center}
.tag.docs{background:#2b6cd4}.tag.slides{background:#d24726}.tag.sheets{background:#1e7145}.tag.pdf{background:#e03a3e}
.empty{margin:0;padding:18px;color:var(--mut)}
.fld{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--sep)}.group>.fld:first-child,.group>div>.fld:first-child{border-top:0}
.fl{flex:0 0 38%;color:var(--fg)}
.fld select,.fld input{flex:1;min-width:0;font:inherit;color:var(--fg);background:transparent;border:0;text-align:right;outline:0;padding:6px 0}
.hint{color:var(--mut);font-size:13px;margin:8px 6px}
.group .primary{width:calc(100% - 28px);margin:12px 14px}
.mini{padding:6px 10px;color:var(--acc);font-size:14px}
.primary.alt{background:var(--card);color:var(--acc);border:1px solid var(--sep)}
/* home: same look as the former 이음오피스 home of the app */
main.home{max-width:none;margin:0;padding:0 2px}
.brand{display:flex;align-items:center;gap:10px;padding:14px 2px 4px}
.brand-icon{width:28px;height:28px;border-radius:7px}
.brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
main.home h2{text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--mut);margin:22px 2px 10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
.newcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--sep)}
.newcard .badge.big{width:38px;height:38px;border-radius:8px;font-size:17px;margin-bottom:12px}
.nc-title{font-size:15px;font-weight:700}.nc-sub{font-size:12px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;border-radius:7px;color:#fff;font-weight:700;font-size:13px}
.opencard{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--sep);text-align:left}
.oc-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--sep);color:var(--fg);flex:none}
.oc-text{display:flex;flex-direction:column;flex:1;min-width:0}.oc-title{font-size:15px;font-weight:700}.oc-sub{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-chev{font-size:24px;color:var(--mut);line-height:1}
main.home .files{border:1px solid var(--sep);border-radius:12px}
main.home .files.none{background:transparent;border:1px dashed var(--sep)}
main.home .empty{text-align:center;padding:34px 18px;color:var(--fg);opacity:.75;font-size:15px}
main.home .file{gap:12px}
.meta{display:flex;flex-direction:column;flex:1;min-width:0;text-align:left}
.meta .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta .sz{font-size:12px;color:var(--mut)}
.recent-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--sep);border-radius:9px;padding:2px;margin-bottom:8px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.recent .files:not(.none){display:grid;grid-template-columns:1fr 1fr}
.recent .files .row{border-top:1px solid var(--sep);min-width:0}
.recent .files .row:nth-child(-n+2){border-top:0}
.recent .files .row:nth-child(odd){border-right:1px solid var(--sep)}
@media(max-width:700px){.recent .files:not(.none){grid-template-columns:1fr}.recent .files .row:nth-child(2){border-top:1px solid var(--sep)}.recent .files .row:nth-child(odd){border-right:0}}
.kind-head{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;font-size:14px;font-weight:700}
.kind-head:first-child{margin-top:4px}
.badge.small{width:22px;height:22px;border-radius:5px;font-size:11px}
.kind-count{font-size:12px;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--sep);border-radius:10px;padding:1px 8px}
.credit{white-space:pre-line;line-height:1.5;text-align:center;color:var(--mut);font-size:11px;margin:28px 0 8px;letter-spacing:.02em}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);background:rgba(60,60,67,.92);color:#fff;padding:10px 18px;border-radius:20px;z-index:9;font-size:15px}
/* AI 연결 */
.ai-status{font-weight:600}.ai-status.on{color:#1e7145}
.ai-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:8px 0 14px}
.ai-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:12px;background:var(--bg);border:2px solid transparent;min-height:64px}
.ai-card b{font-size:16px}.ai-card span{font-size:13px;color:var(--mut)}
.ai-card.sel{border-color:var(--acc)}.ai-card.cur b::after{content:' ●';color:#1e7145}
.ai-form{padding:4px 0}.ai-actions{display:flex;gap:10px;margin:8px 0}
.ai-link{padding:10px 14px;border-radius:10px;background:var(--bg);color:var(--acc);font-weight:600}
</style></head>
<body>
<div id="tabs"></div>
<div id="panes"><div id="homePane"></div><div id="settingsPane" hidden></div></div>
<input id="picker" type="file" hidden accept=".docx,.dotx,.doc,.odt,.hwp,.hwpx,.pptx,.potx,.ppt,.odp,.xlsx,.xlsm,.xls,.ods,.csv,.tsv,.pdf,.pages,.key,.numbers">
<script src="./home.js"></script>
</body></html>
